name: Release

# Publishes to PyPI via Trusted Publishing (OIDC) — no API token is stored in
# this repository. See the setup note at the bottom of this file; the first
# release will fail without it, and that failure is the intended behaviour
# rather than a surprise.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:

  verify:
    name: verify and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]" build twine

      # Publishing is the one irreversible step in this repository: a version
      # cannot be re-uploaded to PyPI once it exists, even after a yank. So
      # the whole gate runs again here rather than trusting that CI passed on
      # some earlier commit.
      - name: ./run_all.sh
        run: PY="$(dirname "$(command -v python)")" ./run_all.sh

      # A tag that disagrees with the version in the package produces a
      # release whose name and contents differ — discoverable only by someone
      # who installs it and wonders why the version is wrong.
      #
      # Three values have to agree, not two. `__version__` is what the code
      # prints; the distribution metadata is what pip and PyPI report; the tag
      # is what the release is filed under. The middle one is derived from the
      # first by `[tool.setuptools.dynamic]`, so comparing all three also
      # proves that derivation still works — if the `attr` lookup ever
      # silently stopped resolving, this is the step that says so.
      - name: tag matches package version
        if: github.event_name == 'release'
        run: |
          python - <<'PY'
          import os
          import sys
          from importlib.metadata import version

          from varda import __version__

          tag = os.environ["TAG"].removeprefix("v")
          dist = version("varda")
          if not (tag == dist == __version__):
              sys.exit(
                  f"version disagreement: tag {tag!r}, "
                  f"distribution {dist!r}, __version__ {__version__!r}"
              )
          print(f"tag, distribution and __version__ all agree: {tag}")
          PY
        env:
          TAG: ${{ github.event.release.tag_name }}

      - name: build
        run: python -m build

      - name: twine check
        run: twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  testpypi:
    name: publish to TestPyPI
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/varda
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: publish to PyPI
    needs: verify
    if: github.event_name == 'release' || inputs.target == 'pypi'
    runs-on: ubuntu-latest
    # Attach required reviewers to this environment in repository settings to
    # put a human between a merged tag and a permanent upload.
    environment:
      name: pypi
      url: https://pypi.org/p/varda
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

# ---------------------------------------------------------------------------
# One-time setup, on PyPI rather than here
#
# At https://pypi.org/manage/account/publishing/ add a pending publisher:
#
#     PyPI project name   varda
#     Owner               mluttikh
#     Repository name     varda
#     Workflow name       release.yml
#     Environment name    pypi
#
# Repeat at https://test.pypi.org/manage/account/publishing/ with environment
# name `testpypi` to use the workflow_dispatch path.
#
# Trusted Publishing is used instead of an API token because a token in
# repository secrets is a long-lived credential that grants upload rights to
# anyone who can run a workflow. OIDC issues a token scoped to this one
# workflow, valid for minutes.
# ---------------------------------------------------------------------------
