name: Docs

# Builds the documentation site and publishes it to GitHub Pages.
#
# The reference pages are generated from the installed package at build time,
# so the site is built with the package installed rather than from a checkout
# of the markdown alone.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: python -m pip install -e ".[docs]"

      # The vocabulary, rules and CLI pages are written from the installed
      # package. Not committed, so this must run before every build.
      - name: generate the reference pages
        run: python scripts/gen_reference.py

      # `--strict` turns a broken internal link into a failed build. The
      # reference pages are generated, so a rule code that changes shape
      # would otherwise leave a dead anchor that nobody clicks until a user
      # does.
      - name: build
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    # Pull requests build the site to prove it still builds, but only main
    # publishes. A docs change should be reviewable without going live.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
