name: CI

# Runs on every push to main and every pull request. The `gate` job below
# invokes `./run_all.sh` — the same script developers run locally — so CI and
# the local gate cannot drift apart. Anything added to one is added to both by
# construction.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to a branch cancels the first run. Reviewing a result that is
# already two commits stale wastes more time than it saves.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"

      # Split into two steps rather than one. A failure here should say
      # immediately whether the code broke a rule or merely needs formatting,
      # because those are a different fix and a different conversation.
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format --check
        run: ruff format --check --diff .

  types:
    name: mypy --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"

      # One version only, deliberately. `python_version` is pinned to 3.11 in
      # pyproject, so mypy checks against that floor regardless of which
      # interpreter runs it — a matrix here would repeat one answer.
      - name: mypy
        run: mypy

  test:
    name: pytest ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Never stop the other cells. A 3.13-only failure is information, and
      # cancelling the rest hides whether it is version-specific.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # Two extra cells rather than a full 3x3. This package walks parent
          # directories looking for varda.toml and joins POSIX-style artifact
          # paths, so a path-separator bug is plausible; a version-specific
          # bug that only shows on one OS is not.
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: pytest
        run: python -m pytest -q

  gate:
    name: full gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"

      # The same script a developer runs locally, pointed at this runner's
      # interpreter. It re-runs lint, types and tests — which the jobs above
      # already cover in parallel for a faster signal — and then does the
      # parts only an end-to-end run can: `varda check --strict` against the
      # shipped example, a generate, and a second generate diffed against the
      # first to prove output is deterministic.
      #
      # When `varda verify` lands in 0.2, it goes in run_all.sh and this job
      # picks it up with no change here.
      - name: ./run_all.sh
        run: PY="$(dirname "$(command -v python)")" ./run_all.sh

  package:
    name: build & check distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install build twine

      - name: build
        run: python -m build

      - name: twine check
        run: twine check --strict dist/*

      # The profile is data, not code, and setuptools will happily build a
      # wheel without it if package-data is misconfigured. The failure then
      # appears only for someone who pip-installed — every rule raises
      # "unknown annotation" because the vocabulary is not there.
      - name: profile and type marker are in the wheel
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          required = {"varda/profile/varda.yaml", "varda/py.typed"}
          missing = required - set(names)
          if missing:
              sys.exit(f"missing from wheel: {', '.join(sorted(missing))}")
          print("wheel contains:", ", ".join(sorted(required)))
          PY

      # Install the built wheel into a clean environment and use it. Catches
      # anything that works from a source checkout but not once packaged.
      - name: smoke-test the wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/varda check examples/retail.yaml --strict
          /tmp/smoke/bin/varda rules > /dev/null
          /tmp/smoke/bin/varda generate examples/retail.yaml --out /tmp/smoke-out
          test -s /tmp/smoke-out/sql/mart.sql

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14
