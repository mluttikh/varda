id: https://example.org/retail
name: retail
title: A retail star schema
description: >-
  A worked example exercising every part of the Varda core: two facts of
  different temporal shapes, four dimensions across three slowly-changing
  types, a degenerate dimension, a bridge resolving a many-to-many, and one
  measure of each additivity class.

prefixes:
  linkml: https://w3id.org/linkml/
  varda: https://w3id.org/varda/
  retail: https://example.org/retail/
default_prefix: retail
default_range: string
imports:
  - linkml:types

classes:

  DimDate:
    description: The calendar, one row per day.
    annotations:
      varda:role: DIMENSION
      varda:scd: TYPE_0
      # Two paths, sharing their finest level. They are separate rather than
      # one chain because a fiscal quarter is not a calendar quarter, and
      # neither contains the other.
      varda:hierarchies:
        - name: calendar
          description: How the business reports externally.
          levels: [calendar_year, calendar_month, calendar_date]
        - name: fiscal
          description: How the business plans and closes its books.
          levels: [fiscal_year, fiscal_quarter, calendar_date]
    attributes:
      date_key:
        description: Surrogate key, conventionally YYYYMMDD.
        range: integer
        required: true
        annotations:
          varda:role: SURROGATE_KEY
      calendar_date:
        description: The day this row describes.
        range: date
        required: true
        annotations:
          varda:role: NATURAL_KEY
      calendar_year:
        range: integer
        annotations:
          varda:role: ATTRIBUTE
      calendar_month:
        description: >-
          The month, year-qualified — `2024-03`, not `March`. A level has to
          name one member on its own, and there is a March in every year.
        annotations:
          varda:role: ATTRIBUTE
      fiscal_year:
        range: integer
        annotations:
          varda:role: ATTRIBUTE
      fiscal_quarter:
        description: The quarter, year-qualified — `FY24-Q3`.
        range: string
        annotations:
          varda:role: ATTRIBUTE
      day_of_week:
        description: >-
          Groups and filters, but belongs to no hierarchy: Tuesdays do not
          roll up into anything.
        range: string
        annotations:
          varda:role: ATTRIBUTE

  DimCustomer:
    description: A purchasing party, versioned as its attributes change.
    annotations:
      varda:role: DIMENSION
      varda:scd: TYPE_2
    attributes:
      customer_key:
        range: integer
        required: true
        annotations:
          varda:role: SURROGATE_KEY
      customer_id:
        description: The identifier the source system uses.
        required: true
        annotations:
          varda:role: NATURAL_KEY
          # The width the source system guarantees. Emitted as
          # VARCHAR(20); left off, this is VARCHAR(1) on SQL Server.
          varda:max_length: 20
      customer_name:
        annotations:
          varda:role: ATTRIBUTE
          varda:max_length: 120
      country:
        annotations:
          varda:role: ATTRIBUTE
          varda:max_length: 2
      valid_from:
        description: Start of this version's period, inclusive.
        range: datetime
        required: true
        annotations:
          varda:role: VERSION_START
      valid_to:
        description: End of this version's period, exclusive; open if null.
        range: datetime
        annotations:
          varda:role: VERSION_END
      is_current:
        description: Flags the version in force now.
        range: boolean
        required: true
        annotations:
          varda:role: IS_CURRENT

  DimProduct:
    description: A sellable item.
    annotations:
      varda:role: DIMENSION
      varda:scd: TYPE_1
      varda:hierarchies:
        - name: merchandise
          levels: [category, brand, sku]
    attributes:
      product_key:
        range: integer
        required: true
        annotations:
          varda:role: SURROGATE_KEY
      sku:
        required: true
        annotations:
          varda:role: NATURAL_KEY
      product_name:
        annotations:
          varda:role: ATTRIBUTE
      brand:
        annotations:
          varda:role: ATTRIBUTE
      category:
        annotations:
          varda:role: ATTRIBUTE

  DimStore:
    description: A physical or online point of sale.
    annotations:
      varda:role: DIMENSION
      varda:scd: TYPE_1
      varda:hierarchies:
        - name: geography
          levels: [country, region, store_code]
    attributes:
      store_key:
        range: integer
        required: true
        annotations:
          varda:role: SURROGATE_KEY
      store_code:
        required: true
        annotations:
          varda:role: NATURAL_KEY
      store_name:
        annotations:
          varda:role: ATTRIBUTE
      region:
        annotations:
          varda:role: ATTRIBUTE
      country:
        annotations:
          varda:role: ATTRIBUTE

  DimSegment:
    description: A marketing segment a customer may belong to.
    annotations:
      varda:role: DIMENSION
      varda:scd: TYPE_1
    attributes:
      segment_key:
        range: integer
        required: true
        annotations:
          varda:role: SURROGATE_KEY
      segment_code:
        required: true
        annotations:
          varda:role: NATURAL_KEY
      segment_name:
        annotations:
          varda:role: ATTRIBUTE

  BridgeCustomerSegment:
    description: >-
      Resolves the many-to-many between customers and segments. Weighted,
      because a customer belonging to three segments must not be counted
      three times in a segment rollup.
    annotations:
      varda:role: BRIDGE
      varda:grain: [customer_key, segment_key]
      varda:grain_statement: >-
        one row per customer per segment they belong to
    attributes:
      customer_key:
        range: integer
        required: true
        annotations:
          varda:role: FOREIGN_KEY
          varda:references: DimCustomer
      segment_key:
        range: integer
        required: true
        annotations:
          varda:role: FOREIGN_KEY
          varda:references: DimSegment
      allocation_factor:
        description: >-
          The share of this customer attributable to this segment. The
          factors for one customer sum to 1.
        range: decimal
        required: true
        unit:
          symbol: ratio
        annotations:
          varda:role: MEASURE
          varda:additivity: NON_ADDITIVE
          # Six places, because a factor is a share of one: two would round
          # a customer split eight ways into eight shares that sum to 0.99.
          varda:precision: 9
          varda:scale: 6

  FctSale:
    description: A line on a sales receipt.
    annotations:
      varda:role: FACT
      varda:fact_type: TRANSACTION
      varda:grain: [order_number, product_key]
      varda:grain_statement: >-
        one row per product per line of a sales receipt
    attributes:
      date_key:
        range: integer
        required: true
        annotations:
          varda:role: FOREIGN_KEY
          varda:references: DimDate
      customer_key:
        range: integer
        required: true
        annotations:
          varda:role: FOREIGN_KEY
          varda:references: DimCustomer
      product_key:
        range: integer
        required: true
        annotations:
          varda:role: FOREIGN_KEY
          varda:references: DimProduct
      store_key:
        range: integer
        required: true
        annotations:
          varda:role: FOREIGN_KEY
          varda:references: DimStore
      order_number:
        description: >-
          The receipt identifier. A degenerate dimension: it groups the lines
          of one transaction but has no attributes of its own.
        required: true
        annotations:
          varda:role: DEGENERATE_DIMENSION
      quantity:
        range: integer
        required: true
        unit:
          symbol: count
        annotations:
          varda:role: MEASURE
          varda:additivity: ADDITIVE
      net_amount:
        description: Line total after discount, excluding tax.
        range: decimal
        required: true
        unit:
          symbol: EUR
        annotations:
          varda:role: MEASURE
          varda:additivity: ADDITIVE
          # Money, so two places exactly. Left undeclared this is
          # unconstrained on one engine and three places on another.
          varda:precision: 18
          varda:scale: 2
      unit_price:
        description: >-
          Price of one unit. Non-additive: summing prices across lines
          produces a number with no meaning.
        range: decimal
        unit:
          symbol: EUR
        annotations:
          varda:role: MEASURE
          varda:additivity: NON_ADDITIVE
          # Four places rather than two: a unit price is what the line total
          # is computed from, and rounding the input rounds every line.
          varda:precision: 18
          varda:scale: 4

  FctInventory:
    description: Stock position, measured at the close of each day.
    annotations:
      varda:role: FACT
      varda:fact_type: PERIODIC_SNAPSHOT
      varda:grain: [date_key, product_key, store_key]
      varda:grain_statement: >-
        one row per product per store per day
    attributes:
      date_key:
        range: integer
        required: true
        annotations:
          varda:role: FOREIGN_KEY
          varda:references: DimDate
      product_key:
        range: integer
        required: true
        annotations:
          varda:role: FOREIGN_KEY
          varda:references: DimProduct
      store_key:
        range: integer
        required: true
        annotations:
          varda:role: FOREIGN_KEY
          varda:references: DimStore
      quantity_on_hand:
        description: >-
          Units in stock at close of business. Semi-additive: summing across
          stores gives total stock, summing across days gives nonsense.
        range: integer
        required: true
        unit:
          symbol: count
        annotations:
          varda:role: MEASURE
          varda:additivity: SEMI_ADDITIVE
          varda:semi_additive_over: date_key
