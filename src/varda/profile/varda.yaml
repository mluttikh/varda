# The identifier is a w3id.org permanent IRI, resolved by the W3C Permanent
# Identifier Community Group to wherever Varda's documentation currently
# lives. It is deliberately not a hostname this project owns.
#
# The reason is that this IRI is copied into the `prefixes:` block of every
# model anyone writes, and into every RDF graph generated from one. It can
# therefore never change. A domain can lapse, be sold, or outlive the
# organisation that registered it, and a lapsed domain baked into published
# schemas is unrecoverable. w3id separates the identifier, which is
# permanent, from the redirect target, which is a one-line change.
#
# LinkML itself does the same: `https://w3id.org/linkml/` redirects into
# GitHub Pages. Registered at github.com/perma-id/w3id.org.
id: https://w3id.org/varda
name: varda
version: 0.1.0
title: The Varda profile — dimensional modeling vocabulary for LinkML
description: >-
  Varda is a *profile* of LinkML, not a replacement for it. LinkML already
  knows about classes, slots, ranges, cardinality, enumerations, inheritance,
  identifiers and imports. It does not know about facts, dimensions, grain,
  additivity or slowly-changing dimensions, because those are dimensional
  modeling concepts rather than general modeling concepts.

  This schema declares the vocabulary Varda adds, as LinkML enumerations and
  classes. Every `varda:` annotation that may appear on a domain model is
  declared here, which makes the profile self-describing: `varda check`
  validates domain models against *this file*, and this file is an ordinary
  LinkML schema that ordinary LinkML tooling can read.

  Nothing here is a LinkML extension in the technical sense. A domain model
  carrying Varda annotations is a legal LinkML schema that `gen-pydantic`,
  `gen-owl`, `gen-json-schema` and every other LinkML generator will consume
  happily, ignoring what they do not understand.

  **Scope.** This is the deliberately small core: twelve annotations that
  describe a standard star schema and nothing else. Anything specific to one
  organization — cost centers, retention, data classification, ownership —
  belongs in an extension under that organization's own prefix. See
  `varda.ext`.

license: https://creativecommons.org/publicdomain/zero/1.0/
prefixes:
  linkml: https://w3id.org/linkml/
  varda: https://w3id.org/varda/
  # OWL-Time, for the `meaning:` mappings on the versioning column
  # roles. A version's period is a temporal interval, and saying so in
  # the vocabulary is what lets a model built on this profile join a
  # knowledge graph instead of only a warehouse.
  time: http://www.w3.org/2006/time#
default_prefix: varda
default_range: string
imports:
  - linkml:types

# ---------------------------------------------------------------------------
# Enumerations — the closed vocabularies.
#
# These are closed on purpose, and the constraint is load-bearing: an
# extension may add annotations but may NOT add a value to an enum here.
# Every generator dispatches exhaustively on these, and a generator that has
# to tolerate an unrecognized value has a silent fallback path instead of a
# mapping. Widening from outside would turn that discipline into a default.
#
# Varda may widen its own enums in a later minor version — that is backward
# compatible, because no existing model breaks when a new value becomes
# legal. So a value missing here is a request to file, not a reason to fork.
# ---------------------------------------------------------------------------

enums:

  TableRole:
    description: >-
      What part a class plays in the dimensional model. Every class carrying
      Varda annotations must declare exactly one.
    permissible_values:
      FACT:
        description: >-
          A measurement event table. Has a declared grain, foreign keys to
          dimensions, and zero or more measures. Never the target of another
          table's foreign key.
      DIMENSION:
        description: >-
          Descriptive context. Has one surrogate key, one or more natural key
          columns, and attributes that are almost always textual or
          categorical. Referenced by facts.
      BRIDGE:
        description: >-
          Resolves a many-to-many between a fact and a dimension, or a
          multi-valued dimension attribute. Carries an allocation factor when
          the many-to-many is weighted.

  ColumnRole:
    description: >-
      What part a slot plays inside its table. Every slot of a class carrying
      Varda annotations must declare exactly one.

      This is the most valuable annotation in the profile: it is what turns a
      flat list of columns into a structure that generators and validators can
      reason about.
    permissible_values:
      SURROGATE_KEY:
        description: >-
          The meaningless integer or hash primary key of a dimension. Exactly
          one per dimension.
      NATURAL_KEY:
        description: >-
          A column carrying the business identity of a dimension row. Together
          the natural key columns — plus, for a type-2 dimension, the validity
          window — must be unique.
      FOREIGN_KEY:
        description: >-
          A reference from a fact or bridge to a dimension's surrogate key.
          Must declare `varda:references`.
      MEASURE:
        description: >-
          A numeric quantity that is aggregated. Must declare
          `varda:additivity`. Lives on a fact or a bridge, never a dimension.
      ATTRIBUTE:
        description: >-
          Descriptive context, grouped and filtered on but not summed. The
          default role for a dimension column.
      DEGENERATE_DIMENSION:
        description: >-
          An identifier that lives on the fact with no dimension table of its
          own — an order number, a ticket reference. Fact tables only.

      VERSION_START:
        description: >-
          The instant from which this version of the row is the one in force.
          Dimensions with `varda:scd: TYPE_2` only.

          Named for the version rather than for validity on purpose. In
          practice this column usually records when the warehouse *observed*
          the change rather than when the change was true in the business —
          dbt's snapshots and Data Vault's `LOAD_DATE` both work this way,
          whatever they are called. Varda does not distinguish the two,
          because separating business validity from load time is
          bitemporality and that is out of scope here.

          The period is closed at the start and open at the end, following
          SQL:2011: a row is in force from this instant up to but not
          including `VERSION_END`. That convention is what stops consecutive
          versions overlapping at their boundary.
        meaning: time:hasBeginning

      VERSION_END:
        description: >-
          The instant at which this version stopped being the one in force,
          exclusive. Dimensions with `varda:scd: TYPE_2` only.

          Optional, and genuinely so. A great many type-2 dimensions store
          only the start and derive the end from the next version's start;
          Data Vault virtualizes it as a view over an insert-only satellite.
          Requiring it would reject correct designs, so nothing does.
        meaning: time:hasEnd

      IS_CURRENT:
        description: >-
          Flags the version in force now. Dimensions with `varda:scd: TYPE_2`
          only.

          Derivable from the period, and materialized anyway almost
          everywhere, because the alternative is a null test or a
          far-future sentinel in every query that wants today's row.

      VERSION_NUMBER:
        description: >-
          A monotonic counter distinguishing versions of one natural key,
          for dimensions that version without timestamps at all. The current
          version is the highest. Dimensions with `varda:scd: TYPE_2` only.

  Additivity:
    description: >-
      How a measure may be aggregated across dimensions. Required on every
      measure, because the wrong answer here is the single most expensive
      class of error a dimensional model produces: silently summing something
      that must not be summed yields a number that looks fine and is wrong.
    permissible_values:
      ADDITIVE:
        description: >-
          May be summed across every dimension of its fact. Sales amount,
          quantity, cost.
      SEMI_ADDITIVE:
        description: >-
          May be summed across some dimensions but not others — almost always
          not across time. Account balance, inventory level, headcount. Must
          declare `varda:semi_additive_over`.
      NON_ADDITIVE:
        description: >-
          May not be summed across any dimension. Ratios, percentages, unit
          prices, temperatures. Aggregate the components and recompute.

  SlowlyChangingType:
    description: >-
      How a dimension responds when a source attribute changes. Kimball's
      numbering, restricted to the three types that are common enough to
      generate for.
    permissible_values:
      TYPE_0:
        description: >-
          Retain original. The value is written once at first load and never
          updated, whatever the source says afterwards.
      TYPE_1:
        description: >-
          Overwrite. No history is kept; the row shows the current value.
      TYPE_2:
        description: >-
          Add a row. History is preserved by versioning: a new row per change,
          bounded by a validity window and marked with a current flag.

  FactType:
    description: >-
      The temporal shape of a fact table, which determines how it is loaded
      and what its grain sentence must say.
    permissible_values:
      TRANSACTION:
        description: >-
          One row per event, at the moment the event occurs. Insert-only.
      PERIODIC_SNAPSHOT:
        description: >-
          One row per entity per regular interval, whether or not anything
          happened. Insert-only, predictable size.
      ACCUMULATING_SNAPSHOT:
        description: >-
          One row per tracked item, updated in place as it passes milestones.
          The only fact shape that is routinely updated after insert.
      FACTLESS:
        description: >-
          One row per event or condition, carrying no measure — coverage,
          eligibility, attendance. Counted rather than summed.

# ---------------------------------------------------------------------------
# Annotation classes.
#
# These classes are never instantiated. They exist so that the set of legal
# annotations is *declared data* rather than a list in the validator's source,
# which is what lets an extension add to it without editing Varda, and what
# lets `varda check` produce "unknown annotation" errors from the profile
# itself.
#
# `varda:applies_to` names which kind of object the annotations may appear on.
# The registry reads it to decide whether `varda:grain` is legal on a slot.
# ---------------------------------------------------------------------------

classes:

  TableAnnotations:
    description: >-
      Annotations permitted on a class that participates in the model.
    annotations:
      varda:applies_to: table
    attributes:

      role:
        description: >-
          What part this table plays. Required on every table.
        range: TableRole
        required: true

      grain:
        description: >-
          The columns at which rows of this table are unique — the set that
          together identifies exactly one row. Required on facts.

          This is the grain proper: in every formal treatment of dimensional
          modeling the grain *is* the column set that identifies a row.

          Every entry must name a column of this table, and each must be a
          foreign key or a degenerate dimension: those are the columns that
          locate a row in the model's dimensional space. A measure cannot be
          part of a grain, because a grain is what a row is, not what it
          records.

          Stating the grain as columns is what makes it checkable — a
          validator can test the claim, and a generator can emit it as a
          uniqueness constraint the database enforces.
        range: string
        multivalued: true

      grain_statement:
        description: >-
          What exactly one row of this table represents, as a sentence.
          Required on facts, alongside `varda:grain`.

          Conventionally phrased "one row per ...". Checked for being a
          sentence and nothing further: `varda:grain` carries the half of
          the claim a validator can test, and this carries the half it
          cannot.

          The sentence is not redundant with the columns. It states *why*
          those columns, and what a row means to somebody reading the model
          rather than querying it. A
          fact table whose grain nobody can state in a sentence is one whose
          double counting nobody can rule out, and the discipline of writing
          it is most of the value.
        range: string

      hierarchies:
        description: >-
          Named drill paths over this dimension's columns. Dimensions only.

          Each hierarchy lists its levels from least to most granular —
          `[country, region, city]`, not the reverse. A column may appear in
          several hierarchies, which is how a date dimension carries both a
          calendar path and a week path: weeks do not nest inside months, so
          they are separate hierarchies rather than one chain.

          A level names what a reader sees when they drill, so it must be
          a column somebody can read. A surrogate key or a foreign key is a
          fine identity and an unreadable label — nobody drills into `4718`
          — so neither may name a level.

          Where the coarser levels are their own tables, write
          `foreign_key.column` to reach the readable column through the key:
          `country_key.country_name` rather than `country_key`. Both halves
          are checked — the near column must be a foreign key of this table,
          and the far one a column of the dimension it points at.

          A level that names a column of this table must identify its
          members on its own. A month level declared as `month_name` is
          wrong, because "January" is a label shared by every January there
          has ever been; the level is a column like `year_month` that names
          exactly one of them. Reaching through a foreign key does not have
          this problem, because the key already picks one row out.

          That each level determines the one above it — that every city is in
          exactly one region — is asserted here and not checked, because it
          is a claim about data rather than about the schema. What is checked
          is that the levels are real, distinct, and the kind of column a
          level can be.

          Only fixed-depth paths where each level rolls up into exactly one
          parent. A hierarchy whose branches differ in depth, whose levels can
          be skipped, or where a child has several parents is a bridge table.
        range: Hierarchy
        multivalued: true
        inlined_as_list: true

      fact_type:
        description: >-
          The temporal shape of a fact table. Facts only.
        range: FactType

      scd:
        description: >-
          How this dimension responds to source changes. Dimensions only.

          Declared on the table rather than per column, because a mixed
          dimension — some attributes type 1, others type 2 — is a genuinely
          harder object that this core deliberately does not model. Split it
          into two dimensions, or handle it in an extension.
        range: SlowlyChangingType

      physical_name:
        description: >-
          The table name to emit, when it differs from the class name. Without
          it, generators derive a physical name from the class name.
        range: string

  ColumnAnnotations:
    description: >-
      Annotations permitted on a slot of a class that participates in the
      model.
    annotations:
      varda:applies_to: column
    attributes:

      role:
        description: >-
          What part this column plays. Required on every column.
        range: ColumnRole
        required: true

      references:
        description: >-
          The name of the class this foreign key points at. Required on every
          column whose role is `FOREIGN_KEY`, and checked: it must name a
          class that exists and that is a dimension or a bridge.
        range: string

      additivity:
        description: >-
          How this measure may be aggregated. Required on every measure.
        range: Additivity

      semi_additive_over:
        description: >-
          The foreign key across which this measure may NOT be summed —
          almost always the date. Required when additivity is
          `SEMI_ADDITIVE`, and checked against the table's actual foreign
          keys, because naming a dimension the fact does not have is a
          constraint that silently never applies.
        range: string

      physical_name:
        description: >-
          The column name to emit, when it differs from the slot name.
        range: string

  Hierarchy:
    description: >-
      One named drill path over a dimension's columns.

      Not an annotation class: it carries no `varda:applies_to`, because it
      is the range of `varda:hierarchies` rather than something a model
      annotates directly.
    attributes:

      name:
        description: >-
          What this path is called, unique within the table. Names it rather
          than numbering it, because a dimension with a calendar path and a
          fiscal path needs the reader to know which is which.
        range: string
        required: true

      levels:
        description: >-
          The level columns, from least to most granular.

          At least two: one level is not a hierarchy, it is a column.
        range: string
        multivalued: true
        required: true
